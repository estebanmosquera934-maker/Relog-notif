          package com.watchnotify

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.os.Build
          import android.os.IBinder

          class WatchService : Service() {
              override fun onBind(i: Intent?): IBinder? = null

              override fun onStartCommand(i: Intent?, f: Int, id: Int): Int {
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(NotificationChannel("watch", "Conexión con el reloj", NotificationManager.IMPORTANCE_LOW))
                  val pi = PendingIntent.getActivity(this, 0, Intent(this, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE)
                  val n = Notification.Builder(this, "watch")
                      .setContentTitle("Reloj Notif activo")
                      .setContentText("Enviando notificaciones al reloj")
                      .setSmallIcon(android.R.drawable.stat_sys_data_bluetooth)
                      .setContentIntent(pi)
                      .build()
                  if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_CONNECTED_DEVICE)
                  } else {
                      startForeground(1, n)
                  }
                  Prefs.addr(this)?.let { Watch.connect(this, it) }
                  return START_STICKY
              }

              override fun onDestroy() {
                  Watch.disconnect()
                  super.onDestroy()
              }
          }
          KOTLIN_EOF_6
          cat > build.gradle.kts <<'KOTLIN_EOF_7'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          KOTLIN_EOF_7
          cat > gradle.properties <<'KOTLIN_EOF_8'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          KOTLIN_EOF_8
          cat > settings.gradle.kts <<'KOTLIN_EOF_9'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "RelojNotif"
          include(":app")
          KOTLIN_EOF_9
      - name: Aceptar licencias del SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
      - name: Compilar
        working-directory: watchapp
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Guardar copia del APK
        uses: actions/upload-artifact@v4
        with:
          name: RelojNotif-apk
          path: watchapp/app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar el APK en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp watchapp/app/build/outputs/apk/debug/app-debug.apk RelojNotif.apk
          gh release create "build-${{ github.run_number }}" RelojNotif.apk --repo "${{ github.repository }}" --title "Reloj Notif ${{ github.run_number }}" --notes "APK de prueba. Descarga RelojNotif.apk e instálalo."
