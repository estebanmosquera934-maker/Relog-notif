          package com.watchnotify

          import android.content.Context

          data class AppDef(val key: String, val name: String, val code: Int, val pkgs: List<String>, val def: Boolean = true)

          val APPS = listOf(
              AppDef("wa", "WhatsApp", 8, listOf("com.whatsapp", "com.whatsapp.w4b")),
              AppDef("tg", "Telegram", 18, listOf("org.telegram.messenger", "org.telegram.messenger.web")),
              AppDef("sms", "Mensajes (SMS)", 1, listOf("com.google.android.apps.messaging", "com.android.mms", "com.samsung.android.messaging", "com.android.messaging")),
              AppDef("ig", "Instagram", 16, listOf("com.instagram.android")),
              AppDef("fb", "Facebook", 4, listOf("com.facebook.katana")),
              AppDef("ms", "Messenger", 23, listOf("com.facebook.orca")),
              AppDef("x", "X (Twitter)", 5, listOf("com.twitter.android")),
              AppDef("sc", "Snapchat", 10, listOf("com.snapchat.android")),
              AppDef("tt", "TikTok", 11, listOf("com.zhiliaoapp.musically", "com.ss.android.ugc.trill")),
              AppDef("li", "LinkedIn", 17, listOf("com.linkedin.android")),
              AppDef("ln", "Line", 7, listOf("jp.naver.line.android")),
              AppDef("vb", "Viber", 22, listOf("com.viber.voip")),
              AppDef("sk", "Skype", 6, listOf("com.skype.raider")),
              AppDef("gm", "Gmail (aparece como SMS)", 1, listOf("com.google.android.gm"), false)
          )

          val SEPS = listOf(": ", " – ", "\n", " ")

          fun cut(s: String, max: Int): String {
              var n = max
              val sb = StringBuilder()
              var i = 0
              while (i < s.length) {
                  if (n <= 0) break
                  val cp = s.codePointAt(i)
                  if (cp > 127) {
                      n -= 2
                      if (n < 0) break
                  } else {
                      n--
                  }
                  sb.appendCodePoint(cp)
                  i += Character.charCount(cp)
              }
              return sb.toString()
          }

          object Prefs {
              private fun p(c: Context) = c.getSharedPreferences("p", Context.MODE_PRIVATE)
              fun addr(c: Context): String? = p(c).getString("addr", null)
              fun setAddr(c: Context, a: String?) { p(c).edit().putString("addr", a).apply() }
              fun on(c: Context): Boolean = p(c).getBoolean("on", false)
              fun setOn(c: Context, v: Boolean) { p(c).edit().putBoolean("on", v).apply() }
              fun sepIdx(c: Context): Int = p(c).getInt("sep", 0).coerceIn(0, SEPS.size - 1)
              fun setSepIdx(c: Context, v: Int) { p(c).edit().putInt("sep", v).apply() }
              fun sep(c: Context): String = SEPS[sepIdx(c)]
              fun max(c: Context): Int = p(c).getInt("max", 300)
              fun setMax(c: Context, v: Int) { p(c).edit().putInt("max", v).apply() }
              fun appOn(c: Context, d: AppDef): Boolean = p(c).getBoolean("app_" + d.key, d.def)
              fun setApp(c: Context, d: AppDef, v: Boolean) { p(c).edit().putBoolean("app_" + d.key, v).apply() }
          }
