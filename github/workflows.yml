name: Compilar Reloj Notif
on:
  push:
    branches: ['**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Crear el proyecto
        run: |
          mkdir -p watchapp && cd watchapp
          mkdir -p app
          cat > app/build.gradle.kts <<'KOTLIN_EOF_0'
